name: carlisle-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - gdal
  - rasterio
  - geopandas
  - numpy
  - matplotlib
  - pandas
  - scipy
  - tqdm 
  - netCDF4
  - psycopg2
  - scikit-learn
  - python-dotenv
  - pytorch=2.6.0
  - torchvision
  - imageio
  - tabulate
  - psutil
  - onnx
  - torch-scatter
  - fiona
  - cartopy
  - seaborn
  # Add any other pip-specific packages here
variables:
  GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".shp,.wd"
  GDAL_CACHEMAX: "512"
